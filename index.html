<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>🎲 Рандомайзер — DENTIK__</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- ЧАТ ПОБЕДИТЕЛЯ -->
  <aside class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <span id="chatTitle">💬 Чат победителя</span>
      <button id="clearChat" type="button" class="chat-close-btn">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty">Здесь появятся сообщения победителя</div>
    </div>
  </aside>

  <!-- Кнопка открытия чата -->
  <button id="openChatBtn" type="button" title="Открыть чат победителя">💬</button>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="content">
    <header>
      <h1>🎲 Рандомайзер розыгрышей</h1>
      <div class="header-actions">
        <button id="themeBtn" type="button" class="ghost-btn">🎨 Classic</button>
        <button id="obsModeBtn" type="button" class="ghost-btn">🎬 OBS-режим (временно не работает)</button>
        <a href="https://www.twitch.tv/dentik__" target="_blank" class="twitch-link">
          twitch.tv/dentik__
        </a>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Участники</h2>
        <textarea id="participants" placeholder="Введите участников (по одному в строке)"></textarea>
        <div class="row">
          <button id="addFromChat" type="button">🔴 Подключиться к чату DENTIK__</button>
          <button id="testBtn" type="button">🧪 Тест</button>
          <input id="keyword" placeholder="!розыгрыш" />
        </div>
        <p>Всего участников: <span id="count">0</span></p>
        <label class="field">Игнор-лист (ники через запятую):
          <input id="ignoreList" placeholder="dentik__, nightbot, streamlabs">
        </label>

        <label class="switch">
          <input type="checkbox" id="cmdMode" checked>
          <span class="slider"></span>
          <span class="switch-label">Команды <code>!join</code> / <code>!leave</code> в чате</span>
        </label>

        <div class="row" style="margin-top:10px;">
          <button id="clearStorage" type="button" class="ghost-btn">🗑️ Сбросить сохранённое</button>
        </div>
      </section>

      <section class="card">
        <h2>Настройки</h2>
        <label class="field">Победителей: <input type="number" id="winnersCount" value="1" min="1"></label>
        <label class="field">Время на ответ (сек): <input type="number" id="timerSec" value="60" min="5"></label>
        <label class="field">Не выигрывать N раундов подряд: <input type="number" id="antiRepeat" value="1" min="0"></label>

        <label class="switch">
          <input type="checkbox" id="soundOn" checked>
          <span class="slider"></span>
          <span class="switch-label">🔊 Звук</span>
        </label>

        <label class="switch">
          <input type="checkbox" id="spinAnim" checked>
          <span class="slider"></span>
          <span class="switch-label">🎡 Анимация рулетки</span>
        </label>

        <label class="switch">
          <input type="checkbox" id="raceMode">
          <span class="slider"></span>
          <span class="switch-label">⚡ Режим «Кто быстрее ответит»</span>
        </label>

        <label class="switch">
          <input type="checkbox" id="confettiOn" checked>
          <span class="slider"></span>
          <span class="switch-label">🎆 Конфетти при выигрыше</span>
        </label>
      </section>

      <section class="card center">
        <button id="startBtn" class="primary" type="button">🎰 Розыгрыш!</button>
        <canvas id="wheel" width="360" height="360" class="wheel-canvas"></canvas>
        <div id="winners" class="winners"></div>
        <div id="timerBarWrap" class="timer-bar-wrap">
          <div id="timerBar" class="timer-bar"></div>
        </div>
        <div id="timer" class="timer"></div>
        <div id="raceStatus" class="race-status"></div>
        <button id="resetBtn" type="button">Сброс</button>
      </section>

      <section class="card">
        <h2>История</h2>
        <ul id="history"></ul>
      </section>
    </main>
  </div>

  <script src="tmi.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
